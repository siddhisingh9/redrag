# Streamlit settings for the RedRAG dashboard (`streamlit run dashboard/app.py`).
#
# The look lives here and in dashboard/theme.py, so restyling means editing
# these two files only. Colours follow the same palette as the HTML report
# (redrag/eval/charts.py): one blue accent, warm greys, no rainbow.
# No `base` is set, so the dashboard follows the system light/dark setting,
# and the Settings menu can switch it. Each mode has its own tuned values.

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
font = "sans-serif"
baseRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
linkColor = "#256abf"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]
chartSequentialColors = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7", "#3987e5", "#2a78d6", "#256abf", "#184f95"]

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
borderColor = "#2c2c2a"
linkColor = "#6da7ec"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#0ca30c", "#9085e9", "#e66767"]
# Dark mode: low values sit near the dark background, high values glow brighter.
# Streamlit requires exactly 10 colours here.
chartSequentialColors = ["#0d366b", "#104281", "#184f95", "#1c5cab", "#256abf", "#2a78d6", "#3987e5", "#5598e7", "#86b6ef", "#cde2fb"]
